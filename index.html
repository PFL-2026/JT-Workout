<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T Dog Workout">
<meta name="theme-color" content="#05070f">
<title>T Dog Workout</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070f; --bg2:#0b1020; --card:#0f1628; --card-hi:#16203a;
    --line:#1f2c4d; --txt:#eaf2ff; --muted:#6f7fa6;
    --cyan:#00f0ff; --violet:#7c4dff; --pink:#ff2bd6; --amber:#fbbf24;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    font-family:'Archivo',sans-serif;color:var(--txt);
    min-height:100vh;min-height:100dvh;
    background:
      radial-gradient(800px 480px at 85% -8%, rgba(124,77,255,.22), transparent 60%),
      radial-gradient(820px 560px at -12% 108%, rgba(0,240,255,.16), transparent 55%),
      radial-gradient(600px 400px at 50% 50%, rgba(255,43,214,.06), transparent 70%),
      var(--bg);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px;}

  header{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .bolt{width:50px;height:50px;flex:none;
    filter:drop-shadow(0 0 14px rgba(0,240,255,.6));
    animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(0,240,255,.45));}50%{filter:drop-shadow(0 0 22px rgba(124,77,255,.8));}}
  h1{font-family:'Anton',sans-serif;font-size:3.2rem;line-height:.86;letter-spacing:.5px;text-transform:uppercase;
    background:linear-gradient(110deg,#fff 10%,var(--cyan) 45%,var(--violet) 80%,var(--pink) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:.78rem;letter-spacing:4px;text-transform:uppercase;margin-top:5px;font-weight:700;}

  /* Date strip */
  .datestrip{display:flex;align-items:center;gap:4px;margin-bottom:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;}
  .datestrip.today{border-color:rgba(0,240,255,.35);box-shadow:0 0 22px rgba(0,240,255,.08);}
  .datenav{background:transparent;border:none;color:var(--cyan);font-family:'Anton';font-size:1.3rem;
    padding:8px 12px;cursor:pointer;border-radius:8px;}
  .datenav:active{background:var(--card-hi);}
  .datepick{flex:1;background:transparent;border:none;color:var(--txt);
    font-family:'Anton',sans-serif;font-size:1.2rem;letter-spacing:1.5px;text-transform:uppercase;
    padding:8px 6px;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;}
  .datepick:active{background:var(--card-hi);border-radius:8px;}
  .dateDots{display:inline-flex;gap:3px;align-items:center;}
  .ddot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .todaybtn{background:transparent;border:none;color:var(--muted);font-family:'Archivo';font-weight:800;
    font-size:.68rem;letter-spacing:2px;text-transform:uppercase;padding:8px 10px;cursor:pointer;border-radius:8px;}
  .todaybtn:active{background:var(--card-hi);}
  .datestrip.today .todaybtn{color:var(--cyan);}

  /* Calendar dialog */
  .calsheet{max-width:380px;}
  .calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .calmonth{flex:1;text-align:center;font-family:'Anton',sans-serif;font-size:1.3rem;
    letter-spacing:1.5px;text-transform:uppercase;
    background:linear-gradient(110deg,var(--cyan),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .calnav{background:var(--bg2);border:1px solid var(--line);color:var(--cyan);
    border-radius:10px;padding:6px 14px;font-family:'Anton',sans-serif;font-size:1rem;cursor:pointer;}
  .calnav:active{background:var(--card-hi);}
  .caldow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .caldow span{text-align:center;font-size:.62rem;font-weight:800;letter-spacing:1.5px;
    color:var(--muted);padding:4px 0;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .calcell{aspect-ratio:1;background:var(--bg2);border:1px solid transparent;border-radius:9px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;font-family:'Archivo';font-weight:800;color:var(--txt);
    font-size:.9rem;gap:3px;transition:all .15s ease;}
  .calcell:active{transform:scale(.94);}
  .calcell.empty{visibility:hidden;cursor:default;}
  .calcell.future{opacity:.35;cursor:default;}
  .calcell.today{border-color:var(--cyan);}
  .calcell.selected{background:linear-gradient(135deg,var(--cyan),var(--violet));
    color:#05070f;border-color:transparent;box-shadow:0 4px 14px rgba(124,77,255,.4);}
  .caldots{display:flex;gap:2px;height:5px;align-items:center;}
  .caldot{width:5px;height:5px;border-radius:50%;}
  .caldot.r0{background:var(--cyan);}
  .caldot.r1{background:var(--violet);}
  .caldot.r2{background:var(--pink);}
  .caldot.r3{background:var(--amber);}
  .calcell.selected .caldot{background:rgba(5,7,15,.7) !important;}
  .callegend{display:flex;gap:10px;justify-content:center;margin-top:14px;padding-top:12px;
    border-top:1px dashed var(--line);flex-wrap:wrap;}
  .legitem{display:flex;align-items:center;gap:5px;font-size:.65rem;font-weight:800;
    letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
  .legdot{width:7px;height:7px;border-radius:50%;}

  /* Stats block */
  .stats{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:16px;padding:14px;margin-top:22px;}
  .statshead{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .logbtn{flex:1;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#05070f;
    border:none;border-radius:12px;padding:12px 14px;font-family:'Anton',sans-serif;
    font-size:1.05rem;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;
    box-shadow:0 6px 18px rgba(124,77,255,.35);}
  .logbtn:active{transform:scale(.97);}
  .ranges{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);
    border-radius:11px;padding:3px;}
  .rng{background:transparent;border:none;color:var(--muted);padding:7px 9px;
    font-family:'Archivo';font-weight:800;font-size:.66rem;letter-spacing:1.5px;
    border-radius:8px;cursor:pointer;}
  .rng.active{background:var(--card-hi);color:var(--cyan);}
  .metric{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .metric:first-of-type{border-top:none;padding-top:8px;}
  .mhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .mlabel{font-family:'Anton',sans-serif;font-size:.82rem;letter-spacing:2.5px;color:var(--muted);}
  .mval{font-family:'Anton',sans-serif;font-size:1.7rem;letter-spacing:.5px;}
  .mval.cyan{color:var(--cyan);}
  .mval.pink{color:var(--pink);}
  .mval .unit{font-size:.85rem;color:var(--muted);letter-spacing:1px;margin-left:2px;}
  .mtrend{margin-left:auto;font-weight:800;font-size:.74rem;letter-spacing:1px;color:var(--muted);}
  .mtrend.down{color:#4ade80;}
  .mtrend.up{color:#fb7185;}
  .chart{width:100%;height:88px;display:block;}

  /* Generic dialog */
  dialog.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px;
    color:var(--txt);padding:0;max-width:360px;width:calc(100% - 32px);
    font-family:'Archivo',sans-serif;}
  dialog.sheet::backdrop{background:rgba(5,7,15,.7);backdrop-filter:blur(4px);}
  .sheetin{padding:20px;}
  .sheettitle{font-family:'Anton',sans-serif;font-size:1.7rem;letter-spacing:1.5px;
    text-transform:uppercase;margin-bottom:14px;
    background:linear-gradient(110deg,var(--cyan),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .frow{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .frow label{font-weight:800;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);width:88px;}
  .frow input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-family:'Archivo';font-weight:800;font-size:1.05rem;
    color:var(--txt);text-align:center;}
  .frow input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,240,255,.12);}
  .frow input[type="date"]{font-family:'Anton',sans-serif;letter-spacing:1px;}
  .sheetbtns{display:flex;gap:8px;margin-top:14px;}
  .sheetbtns button{flex:1;padding:13px;border-radius:12px;border:none;
    font-family:'Anton',sans-serif;font-size:1rem;letter-spacing:1.5px;cursor:pointer;
    text-transform:uppercase;}
  .sheetcancel{background:var(--bg2);color:var(--muted);border:1px solid var(--line) !important;}
  .sheetsave{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#05070f;}
  .sheetdelete{background:transparent;color:var(--muted);border:none !important;
    font-family:'Archivo' !important;font-weight:700;font-size:.72rem !important;
    letter-spacing:2px;margin-top:8px;width:100%;padding:8px;cursor:pointer;}
  .sheetdelete:active{color:var(--pink);}

  /* Tabs */
  .tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px;}
  .tab{appearance:none;border:1px solid var(--line);background:var(--card);
    color:var(--muted);border-radius:16px;padding:15px 10px;cursor:pointer;
    font-family:'Anton',sans-serif;letter-spacing:1.5px;font-size:1.45rem;line-height:1;
    text-transform:uppercase;transition:all .18s ease;text-align:center;}
  .tab small{display:block;font-family:'Archivo';font-weight:800;font-size:.58rem;letter-spacing:3px;margin-top:5px;opacity:.65;}
  .tab.active{color:#05070f;border-color:transparent;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 8px 26px rgba(124,77,255,.45);}
  .tab:active{transform:scale(.96);}

  .panel{display:none;animation:fade .3s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .ex{display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-left:3px solid var(--cyan);
    border-radius:16px;padding:15px 16px;margin-bottom:11px;transition:all .15s ease;}
  .ex:active{background:var(--card-hi);transform:scale(.99);}
  .ex.done{opacity:.4;border-left-color:var(--violet);}
  .ex.done .name{text-decoration:line-through;}
  .num{font-family:'Anton';font-size:1.5rem;color:var(--cyan);width:28px;flex:none;text-align:center;}
  .info{flex:1;min-width:0;}
  .name{font-size:1.16rem;font-weight:800;line-height:1.12;letter-spacing:.2px;}
  .reps{color:var(--muted);font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:600;}
  .reps b{color:var(--pink);font-weight:900;}
  .check{width:28px;height:28px;flex:none;border-radius:50%;
    border:2px solid var(--line);display:grid;place-items:center;
    color:transparent;font-weight:900;transition:all .2s ease;}
  .ex.done .check{background:var(--violet);border-color:var(--violet);color:#fff;}

  .foot{text-align:center;color:var(--muted);font-size:.7rem;letter-spacing:3px;text-transform:uppercase;margin-top:24px;font-weight:700;}
  .reset{background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:11px;padding:9px 18px;font-family:'Archivo';font-weight:700;
    letter-spacing:2px;cursor:pointer;margin-top:12px;font-size:.74rem;text-transform:uppercase;}
  .reset:active{background:var(--card);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="bolt" viewBox="0 0 100 100"><path d="M58 8 L26 56 L47 56 L38 92 L74 40 L52 40 Z" fill="url(#g)" stroke="#7c4dff" stroke-width="2"/><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient></defs></svg>
    <div>
      <h1>T Dog Workout</h1>
      <div class="sub">Train · Reps · Repeat</div>
    </div>
  </header>

  <div class="datestrip" id="datestrip">
    <button class="datenav" id="prevDay">◀</button>
    <button class="datepick" id="datePick">
      <span id="dateLabel">—</span>
      <span class="dateDots" id="dateDots"></span>
    </button>
    <button class="datenav" id="nextDay">▶</button>
    <button class="todaybtn" id="todayBtn">Today</button>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <div id="panels"></div>

  <div class="foot">
    <div id="progress">0 / 0 done</div>
    <button class="reset" id="reset">Reset This Day</button>
  </div>

  <section class="stats">
    <div class="statshead">
      <button class="logbtn" id="openLog">+ Log Weigh-in</button>
      <div class="ranges">
        <button class="rng active" data-range="30">30D</button>
        <button class="rng" data-range="90">90D</button>
        <button class="rng" data-range="all">All</button>
      </div>
    </div>
    <div class="metric">
      <div class="mhead">
        <span class="mlabel">Weight</span>
        <span class="mval cyan" id="weightVal">—<span class="unit">kg</span></span>
        <span class="mtrend" id="weightTrend"></span>
      </div>
      <svg class="chart" id="weightChart" viewBox="0 0 400 100" preserveAspectRatio="none"></svg>
    </div>
    <div class="metric">
      <div class="mhead">
        <span class="mlabel">Body Fat</span>
        <span class="mval pink" id="fatVal">—<span class="unit">%</span></span>
        <span class="mtrend" id="fatTrend"></span>
      </div>
      <svg class="chart" id="fatChart" viewBox="0 0 400 100" preserveAspectRatio="none"></svg>
    </div>
  </section>
</div>

<dialog class="sheet" id="logSheet">
  <div class="sheetin">
    <div class="sheettitle">Log Weigh-in</div>
    <div class="frow">
      <label>Date</label>
      <input type="date" id="logDate">
    </div>
    <div class="frow">
      <label>Weight</label>
      <input type="number" inputmode="decimal" step="0.1" id="logWeight" placeholder="kg">
    </div>
    <div class="frow">
      <label>Body Fat</label>
      <input type="number" inputmode="decimal" step="0.1" id="logFat" placeholder="%">
    </div>
    <div class="sheetbtns">
      <button class="sheetcancel" id="cancelLog">Cancel</button>
      <button class="sheetsave" id="saveLog">Save</button>
    </div>
    <button class="sheetdelete" id="deleteLog">Delete entry for this date</button>
  </div>
</dialog>

<dialog class="sheet calsheet" id="calSheet">
  <div class="sheetin">
    <div class="sheettitle">Workout Log</div>
    <div class="calhead">
      <button class="calnav" id="prevMonth">◀</button>
      <div class="calmonth" id="calMonth">—</div>
      <button class="calnav" id="nextMonth">▶</button>
    </div>
    <div class="caldow">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="calgrid" id="calGrid"></div>
    <div class="callegend">
      <span class="legitem"><span class="legdot" style="background:#00f0ff"></span>Ham</span>
      <span class="legitem"><span class="legdot" style="background:#7c4dff"></span>Quad</span>
      <span class="legitem"><span class="legdot" style="background:#ff2bd6"></span>Pull</span>
      <span class="legitem"><span class="legdot" style="background:#fbbf24"></span>Push</span>
    </div>
    <div class="sheetbtns">
      <button class="sheetcancel" id="closeCal">Close</button>
    </div>
  </div>
</dialog>

<script>
const ROUTINES = [
  { name:"Hamstring", tag:"Lower", ex:[
    ["Dumbbell Deadlifts","8"],["Hamstring Curls","8"],["Reverse Dumbbell Lunges","8"],
    ["45° Leg Press (Wide)","8"],["Adductor Machine","10"],["Seated Calf Raise","12"],
    ["Hanging Knee Raises","15 × 3"],["Decline Crunches","15 × 3"],
  ]},
  { name:"Quads", tag:"Lower", ex:[
    ["Bulgarian Split Squats","8"],["45° Leg Press (Shoulder)","8"],["Seated Leg Curl (Hammy)","8"],
    ["Dumbbell Walking Lunges","10"],["Leg Extension (Knee)","10"],["Wall Calf Raises","20 × 3"],
    ["Cable Crunches Abs","12"],["Reverse Crunches","15 × 3"],
  ]},
  { name:"Pull", tag:"Upper", ex:[
    ["Standing Shoulder Press","10"],["Chin Ups","15 × 3"],["Incline Dumbbell Press","8"],
    ["Seated Cable Rows","8"],["Standing Barbell Curls","8"],["Seated Hammer Curls","8"],
    ["Cable Rear Delt Rows","12"],["Dumbbell Shrugs","10"],
  ]},
  { name:"Push", tag:"Upper", ex:[
    ["Barbell Bench Press","8"],["Single Arm Rows","8"],["Incline Dumbbell Press","8"],
    ["Wide Grip Lat Pulldown","8"],["Standing Dumbbell Lat Raises","12"],
    ["Cable Crossovers (Chest)","8"],["Tricep Skullcrushers","12"],["Tricep Extension","15"],
  ]},
];
const ROUTINE_COLORS=['#00f0ff','#7c4dff','#ff2bd6','#fbbf24'];

const STORE='tdog-v2';
let state={workouts:{},body:{}};
try{state=Object.assign(state,JSON.parse(localStorage.getItem(STORE)||'{}'));}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}

// Date helpers
let currentDate=new Date();currentDate.setHours(0,0,0,0);
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(d){return DAYS[d.getDay()]+' · '+d.getDate()+' '+MONTHS[d.getMonth()];}
function fmtShort(d){return d.getDate()+' '+MONTHS[d.getMonth()];}
function isTodayDate(d){const t=new Date();t.setHours(0,0,0,0);return d.getTime()===t.getTime();}
function curKey(){return isoDate(currentDate);}
function routinesForDay(k){
  const day=state.workouts[k];if(!day)return new Set();
  const r=new Set();
  Object.keys(day).forEach(key=>r.add(parseInt(key.split('-')[0],10)));
  return r;
}

// Tabs/panels
const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');
const progressEl=document.getElementById('progress');
let active=0;

ROUTINES.forEach((r,i)=>{
  const t=document.createElement('button');
  t.className='tab'+(i===0?' active':'');
  t.innerHTML=r.name+'<small>'+r.tag+'</small>';
  t.onclick=()=>select(i);
  tabsEl.appendChild(t);

  const p=document.createElement('div');
  p.className='panel'+(i===0?' active':'');
  r.ex.forEach((e,j)=>{
    const key=i+'-'+j;
    const row=document.createElement('div');
    row.className='ex';row.dataset.key=key;
    row.innerHTML='<div class="num">'+(j+1)+'</div>'+
      '<div class="info"><div class="name">'+e[0]+'</div>'+
      '<div class="reps"><b>'+e[1]+'</b> reps · weight: ___</div></div>'+
      '<div class="check">✓</div>';
    row.onclick=()=>{
      const k=curKey();
      if(!state.workouts[k])state.workouts[k]={};
      const next=!row.classList.contains('done');
      if(next)state.workouts[k][key]=true;else delete state.workouts[k][key];
      if(Object.keys(state.workouts[k]).length===0)delete state.workouts[k];
      row.classList.toggle('done',next);
      save();updateProgress();updateDateDots();
    };
    p.appendChild(row);
  });
  panelsEl.appendChild(p);
});
function select(i){
  active=i;
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===i));
  document.querySelectorAll('.panel').forEach((p,k)=>p.classList.toggle('active',k===i));
  updateProgress();
}
function refreshExercises(){
  const day=state.workouts[curKey()]||{};
  document.querySelectorAll('.ex').forEach(ex=>ex.classList.toggle('done',!!day[ex.dataset.key]));
  updateProgress();updateDateDots();
}
function updateProgress(){
  const p=document.querySelectorAll('.panel')[active];
  progressEl.textContent=p.querySelectorAll('.ex.done').length+' / '+p.querySelectorAll('.ex').length+' done';
}
document.getElementById('reset').onclick=()=>{
  const k=curKey();
  if(state.workouts[k]){
    document.querySelectorAll('.panel')[active].querySelectorAll('.ex').forEach(ex=>delete state.workouts[k][ex.dataset.key]);
    if(Object.keys(state.workouts[k]).length===0)delete state.workouts[k];
    save();
  }
  refreshExercises();
};

// Date UI
const dateLabel=document.getElementById('dateLabel');
const datestrip=document.getElementById('datestrip');
const dateDots=document.getElementById('dateDots');
function updateDateUI(){
  dateLabel.textContent=fmtDate(currentDate);
  datestrip.classList.toggle('today',isTodayDate(currentDate));
}
function updateDateDots(){
  const routines=routinesForDay(curKey());
  let html='';
  [0,1,2,3].forEach(r=>{if(routines.has(r))html+='<span class="ddot" style="background:'+ROUTINE_COLORS[r]+'"></span>';});
  dateDots.innerHTML=html;
}
function changeDate(delta){currentDate.setDate(currentDate.getDate()+delta);onDateChange();}
function onDateChange(){updateDateUI();refreshExercises();}
document.getElementById('prevDay').onclick=()=>changeDate(-1);
document.getElementById('nextDay').onclick=()=>changeDate(1);
document.getElementById('todayBtn').onclick=()=>{currentDate=new Date();currentDate.setHours(0,0,0,0);onDateChange();};

// Calendar
const calSheet=document.getElementById('calSheet');
let calMonth=new Date(currentDate);calMonth.setDate(1);

function openCal(){
  calMonth=new Date(currentDate);calMonth.setDate(1);
  renderCal();calSheet.showModal();
}
function renderCal(){
  document.getElementById('calMonth').textContent=MONTHS_FULL[calMonth.getMonth()]+' '+calMonth.getFullYear();
  const startDow=calMonth.getDay();
  const lastDate=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const selKey=curKey();
  let html='';
  for(let i=0;i<startDow;i++)html+='<div class="calcell empty"></div>';
  for(let d=1;d<=lastDate;d++){
    const dt=new Date(calMonth.getFullYear(),calMonth.getMonth(),d);
    const k=isoDate(dt);
    const routines=routinesForDay(k);
    let dots='';
    if(routines.size){
      dots='<div class="caldots">';
      [0,1,2,3].forEach(r=>{if(routines.has(r))dots+='<span class="caldot r'+r+'"></span>';});
      dots+='</div>';
    }
    const isT=dt.getTime()===today.getTime();
    const isFuture=dt.getTime()>today.getTime();
    const isSel=k===selKey;
    const cls='calcell'+(isT?' today':'')+(isSel?' selected':'')+(isFuture?' future':'');
    html+='<div class="'+cls+'" data-date="'+k+'"><span>'+d+'</span>'+dots+'</div>';
  }
  document.getElementById('calGrid').innerHTML=html;
  document.querySelectorAll('.calcell[data-date]').forEach(c=>{
    c.onclick=()=>{
      const k=c.dataset.date;
      const [y,m,d]=k.split('-').map(Number);
      currentDate=new Date(y,m-1,d);currentDate.setHours(0,0,0,0);
      onDateChange();calSheet.close();
    };
  });
}
document.getElementById('prevMonth').onclick=()=>{calMonth.setMonth(calMonth.getMonth()-1);renderCal();};
document.getElementById('nextMonth').onclick=()=>{calMonth.setMonth(calMonth.getMonth()+1);renderCal();};
document.getElementById('closeCal').onclick=e=>{e.preventDefault();calSheet.close();};
calSheet.addEventListener('click',e=>{
  const r=calSheet.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)calSheet.close();
});
document.getElementById('datePick').onclick=openCal;

// Stats / chart
let range='30';
document.querySelectorAll('.rng').forEach(b=>{
  b.onclick=()=>{
    range=b.dataset.range;
    document.querySelectorAll('.rng').forEach(x=>x.classList.toggle('active',x===b));
    renderStats();
  };
});
function getSeries(metric){
  const now=Date.now();
  const cutoff=range==='all'?0:now-(parseInt(range,10))*86400000;
  return Object.entries(state.body)
    .filter(([d,e])=>e[metric]!=null)
    .map(([d,e])=>({date:d,time:new Date(d+'T00:00:00').getTime(),value:e[metric]}))
    .filter(p=>p.time>=cutoff)
    .sort((a,b)=>a.time-b.time);
}
function drawChart(svgId,series,color){
  const svg=document.getElementById(svgId);
  const W=400,H=100,padL=8,padR=8,padT=10,padB=18;
  const cw=W-padL-padR,ch=H-padT-padB;
  if(series.length===0){
    svg.innerHTML='<text x="'+W/2+'" y="'+(H/2+4)+'" text-anchor="middle" fill="#6f7fa6" font-size="11" font-family="Archivo" font-weight="800" letter-spacing="2.5">NO DATA YET — TAP "LOG WEIGH-IN"</text>';
    return;
  }
  const vals=series.map(p=>p.value);
  let vMin=Math.min(...vals),vMax=Math.max(...vals);
  if(vMin===vMax){vMin-=1;vMax+=1;}
  const pad=(vMax-vMin)*0.2;vMin-=pad;vMax+=pad;
  const t0=series[0].time,t1=series[series.length-1].time;
  const tRange=Math.max(t1-t0,86400000);
  const xFor=t=>padL+((t-t0)/tRange)*cw;
  const yFor=v=>padT+(1-(v-vMin)/(vMax-vMin))*ch;
  let grid='';
  for(let i=0;i<=2;i++){
    const y=padT+(ch/2)*i;
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#1f2c4d" stroke-dasharray="2,4" stroke-width="0.5"/>';
  }
  let path='',area='';
  if(series.length===1){
    const x=xFor(series[0].time),y=yFor(series[0].value);
    path='M'+(x-2)+','+y+' L'+(x+2)+','+y;
  }else{
    series.forEach((p,i)=>{const x=xFor(p.time),y=yFor(p.value);path+=(i===0?'M':'L')+x+','+y+' ';});
    area='M'+xFor(series[0].time)+','+(padT+ch)+' ';
    series.forEach(p=>{area+='L'+xFor(p.time)+','+yFor(p.value)+' ';});
    area+='L'+xFor(series[series.length-1].time)+','+(padT+ch)+' Z';
  }
  let dots='';
  series.forEach(p=>{dots+='<circle cx="'+xFor(p.time)+'" cy="'+yFor(p.value)+'" r="2.8" fill="'+color+'" stroke="#0f1628" stroke-width="1.5"/>';});
  const gradId='g_'+svgId;
  const sd=new Date(t0),ed=new Date(t1);
  const xLabels=series.length>1?
    '<text x="'+padL+'" y="'+(H-4)+'" text-anchor="start" fill="#6f7fa6" font-size="9" font-family="Archivo" font-weight="700" letter-spacing="1">'+fmtShort(sd)+'</text>'+
    '<text x="'+(W-padR)+'" y="'+(H-4)+'" text-anchor="end" fill="#6f7fa6" font-size="9" font-family="Archivo" font-weight="700" letter-spacing="1">'+fmtShort(ed)+'</text>':'';
  svg.innerHTML=
    '<defs><linearGradient id="'+gradId+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+color+'" stop-opacity="0.28"/>'+
    '<stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+
    (area?'<path d="'+area+'" fill="url(#'+gradId+')"/>':'')+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
    dots+xLabels;
}
function updateHeader(metric,valId,trendId,unit){
  const series=getSeries(metric);
  const valEl=document.getElementById(valId);
  const trendEl=document.getElementById(trendId);
  if(series.length===0){
    valEl.innerHTML='—<span class="unit">'+unit+'</span>';
    trendEl.textContent='';trendEl.className='mtrend';return;
  }
  const last=series[series.length-1].value;
  valEl.innerHTML=last+'<span class="unit">'+unit+'</span>';
  if(series.length<2){trendEl.textContent='1 entry';trendEl.className='mtrend';return;}
  const first=series[0].value;
  const delta=+(last-first).toFixed(1);
  const arrow=delta>0?'▲':delta<0?'▼':'–';
  const sign=delta>0?'+':'';
  trendEl.textContent=arrow+' '+sign+delta+' '+unit;
  trendEl.className='mtrend '+(delta>0?'up':delta<0?'down':'');
}
function renderStats(){
  drawChart('weightChart',getSeries('weight'),'#00f0ff');
  drawChart('fatChart',getSeries('fat'),'#ff2bd6');
  updateHeader('weight','weightVal','weightTrend','kg');
  updateHeader('fat','fatVal','fatTrend','%');
}

// Log dialog
const logSheet=document.getElementById('logSheet');
const logDate=document.getElementById('logDate');
const logWeight=document.getElementById('logWeight');
const logFat=document.getElementById('logFat');
function openLog(){
  const k=isoDate(new Date());
  logDate.value=k;loadLogFor(k);logSheet.showModal();
}
function loadLogFor(k){
  const e=state.body[k];
  logWeight.value=e&&e.weight!=null?e.weight:'';
  logFat.value=e&&e.fat!=null?e.fat:'';
}
logDate.addEventListener('change',()=>loadLogFor(logDate.value));
document.getElementById('openLog').onclick=openLog;
document.getElementById('cancelLog').onclick=e=>{e.preventDefault();logSheet.close();};
document.getElementById('saveLog').onclick=e=>{
  e.preventDefault();
  const k=logDate.value;if(!k)return;
  const w=parseFloat(logWeight.value),f=parseFloat(logFat.value);
  const entry={};
  if(!isNaN(w))entry.weight=w;
  if(!isNaN(f))entry.fat=f;
  if(Object.keys(entry).length)state.body[k]=entry;else delete state.body[k];
  save();renderStats();logSheet.close();
};
document.getElementById('deleteLog').onclick=e=>{
  e.preventDefault();
  const k=logDate.value;if(!k)return;
  delete state.body[k];save();renderStats();logSheet.close();
};
logSheet.addEventListener('click',e=>{
  const r=logSheet.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)logSheet.close();
});

// init
updateDateUI();refreshExercises();renderStats();
</script>
</body>
