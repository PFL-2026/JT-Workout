<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T Dog Workout">
<meta name="theme-color" content="#05070f">
<title>T Dog Workout</title>

<!-- Favicons / icons for every context -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070f;
    --bg2:#0b1020;
    --card:#0f1628;
    --card-hi:#16203a;
    --line:#1f2c4d;
    --txt:#eaf2ff;
    --muted:#6f7fa6;
    --cyan:#00f0ff;
    --violet:#7c4dff;
    --pink:#ff2bd6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    font-family:'Archivo',sans-serif;
    color:var(--txt);
    min-height:100vh;min-height:100dvh;
    background:
      radial-gradient(800px 480px at 85% -8%, rgba(124,77,255,.22), transparent 60%),
      radial-gradient(820px 560px at -12% 108%, rgba(0,240,255,.16), transparent 55%),
      radial-gradient(600px 400px at 50% 50%, rgba(255,43,214,.06), transparent 70%),
      var(--bg);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px;}

  header{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .bolt{
    width:50px;height:50px;flex:none;
    filter:drop-shadow(0 0 14px rgba(0,240,255,.6));
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(0,240,255,.45));}50%{filter:drop-shadow(0 0 22px rgba(124,77,255,.8));}}
  h1{
    font-family:'Anton',sans-serif;
    font-size:3.2rem;line-height:.86;letter-spacing:.5px;text-transform:uppercase;
    background:linear-gradient(110deg,#fff 10%,var(--cyan) 45%,var(--violet) 80%,var(--pink) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--muted);font-size:.78rem;letter-spacing:4px;text-transform:uppercase;margin-top:5px;font-weight:700;}

  .tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:20px;}
  .tab{
    appearance:none;border:1px solid var(--line);background:var(--card);
    color:var(--muted);border-radius:16px;padding:15px 10px;cursor:pointer;
    font-family:'Anton',sans-serif;letter-spacing:1.5px;font-size:1.45rem;line-height:1;
    text-transform:uppercase;transition:all .18s ease;text-align:center;position:relative;overflow:hidden;
  }
  .tab small{display:block;font-family:'Archivo';font-weight:800;font-size:.58rem;letter-spacing:3px;margin-top:5px;opacity:.65;}
  .tab.active{
    color:#05070f;border-color:transparent;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 8px 26px rgba(124,77,255,.45);
  }
  .tab:active{transform:scale(.96);}

  .panel{display:none;animation:fade .35s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .ex{
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-left:3px solid var(--cyan);
    border-radius:16px;padding:15px 16px;margin-bottom:11px;
    transition:all .15s ease;
  }
  .ex:active{background:var(--card-hi);transform:scale(.99);}
  .ex.done{opacity:.4;border-left-color:var(--violet);}
  .ex.done .name{text-decoration:line-through;}
  .num{font-family:'Anton';font-size:1.5rem;color:var(--cyan);width:28px;flex:none;text-align:center;}
  .info{flex:1;min-width:0;}
  .name{font-size:1.16rem;font-weight:800;line-height:1.12;letter-spacing:.2px;}
  .reps{color:var(--muted);font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:600;}
  .reps b{color:var(--pink);font-weight:900;}
  .check{
    width:28px;height:28px;flex:none;border-radius:50%;
    border:2px solid var(--line);display:grid;place-items:center;
    color:transparent;font-weight:900;transition:all .2s ease;
  }
  .ex.done .check{background:var(--violet);border-color:var(--violet);color:#fff;}

  .foot{text-align:center;color:var(--muted);font-size:.7rem;letter-spacing:3px;text-transform:uppercase;margin-top:26px;font-weight:700;}
  .reset{
    background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:11px;padding:9px 18px;font-family:'Archivo';font-weight:700;
    letter-spacing:2px;cursor:pointer;margin-top:13px;font-size:.74rem;text-transform:uppercase;
  }
  .reset:active{background:var(--card);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="bolt" viewBox="0 0 100 100"><path d="M58 8 L26 56 L47 56 L38 92 L74 40 L52 40 Z" fill="url(#g)" stroke="#7c4dff" stroke-width="2"/><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient></defs></svg>
    <div>
      <h1>T Dog Workout</h1>
      <div class="sub">Train · Reps · Repeat</div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="panels"></div>

  <div class="foot">
    <div id="progress">0 / 0 done</div>
    <button class="reset" id="reset">Reset Day</button>
  </div>
</div>

<script>
const ROUTINES = [
  { name:"Hamstring", tag:"Lower", ex:[
    ["Dumbbell Deadlifts","8"],
    ["Hamstring Curls","8"],
    ["Reverse Dumbbell Lunges","8"],
    ["45° Leg Press (Wide)","8"],
    ["Adductor Machine","10"],
    ["Seated Calf Raise","12"],
    ["Hanging Knee Raises","15 × 3"],
    ["Decline Crunches","15 × 3"],
  ]},
  { name:"Quads", tag:"Lower", ex:[
    ["Bulgarian Split Squats","8"],
    ["45° Leg Press (Shoulder)","8"],
    ["Seated Leg Curl (Hammy)","8"],
    ["Dumbbell Walking Lunges","10"],
    ["Leg Extension (Knee)","10"],
    ["Wall Calf Raises","20 × 3"],
    ["Cable Crunches Abs","12"],
    ["Reverse Crunches","15 × 3"],
  ]},
  { name:"Pull", tag:"Upper", ex:[
    ["Standing Shoulder Press","10"],
    ["Chin Ups","15 × 3"],
    ["Incline Dumbbell Press","8"],
    ["Seated Cable Rows","8"],
    ["Standing Barbell Curls","8"],
    ["Seated Hammer Curls","8"],
    ["Cable Rear Delt Rows","12"],
    ["Dumbbell Shrugs","10"],
  ]},
  { name:"Push", tag:"Upper", ex:[
    ["Barbell Bench Press","8"],
    ["Single Arm Rows","8"],
    ["Incline Dumbbell Press","8"],
    ["Wide Grip Lat Pulldown","8"],
    ["Standing Dumbbell Lat Raises","12"],
    ["Cable Crossovers (Chest)","8"],
    ["Tricep Skullcrushers","12"],
    ["Tricep Extension","15"],
  ]},
];

const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');
const progressEl=document.getElementById('progress');
let active=0;

// load saved done-state
let saved={};
try{ saved=JSON.parse(localStorage.getItem('tdog')||'{}'); }catch(e){ saved={}; }
function persist(){ try{ localStorage.setItem('tdog',JSON.stringify(saved)); }catch(e){} }

ROUTINES.forEach((r,i)=>{
  const t=document.createElement('button');
  t.className='tab'+(i===0?' active':'');
  t.innerHTML=r.name+'<small>'+r.tag+'</small>';
  t.onclick=()=>select(i);
  tabsEl.appendChild(t);

  const p=document.createElement('div');
  p.className='panel'+(i===0?' active':'');
  r.ex.forEach((e,j)=>{
    const key=i+'-'+j;
    const row=document.createElement('div');
    row.className='ex'+(saved[key]?' done':'');
    row.innerHTML='<div class="num">'+(j+1)+'</div>'+
      '<div class="info"><div class="name">'+e[0]+'</div>'+
      '<div class="reps"><b>'+e[1]+'</b> reps · weight: ___</div></div>'+
      '<div class="check">✓</div>';
    row.onclick=()=>{
      row.classList.toggle('done');
      saved[key]=row.classList.contains('done');
      persist();
      updateProgress();
    };
    p.appendChild(row);
  });
  panelsEl.appendChild(p);
});

function select(i){
  active=i;
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===i));
  document.querySelectorAll('.panel').forEach((p,k)=>p.classList.toggle('active',k===i));
  updateProgress();
}
function updateProgress(){
  const p=document.querySelectorAll('.panel')[active];
  const total=p.querySelectorAll('.ex').length;
  const done=p.querySelectorAll('.ex.done').length;
  progressEl.textContent=done+' / '+total+' done';
}
document.getElementById('reset').onclick=()=>{
  document.querySelectorAll('.panel')[active].querySelectorAll('.ex').forEach((e,j)=>{
    e.classList.remove('done');
    saved[active+'-'+j]=false;
  });
  persist();
  updateProgress();
};
updateProgress();
</script>
</body>
</html>
